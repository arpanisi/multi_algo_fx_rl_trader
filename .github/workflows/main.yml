name: Main CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run full unit tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Tier 1 smoke test (RL pipeline & training)
        run: |
          PYTHONPATH=. python scripts/run_tier1_smoke.py

      - name: Run linter (final gate)
        run: |
          ruff check --select=E9,F63,F7,F82 .
